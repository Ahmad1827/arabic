<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07463f" />
    <script>
      // Applies the chosen light or dark look before the page is drawn, so it never flashes the wrong one.
      try {
        const theme = JSON.parse(localStorage.getItem("reader-settings") || "{}").theme;
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Arabic Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">
        <span class="brand-mark" lang="ar" aria-hidden="true">ض</span>
        <span class="brand-name">Arabic Reader</span>
      </a>
      <nav aria-label="Main">
        <a href="#/" data-nav="read">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" /></svg>
          <span>Read</span>
        </a>
        <a href="#/library" data-nav="library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16" /></svg>
          <span>Library</span>
        </a>
        <a href="#/alphabet" data-nav="alphabet">
          <span class="nav-glyph" lang="ar" aria-hidden="true">ع</span>
          <span>Alphabet</span>
        </a>
        <a href="#/words" data-nav="words">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></svg>
          <span>Words</span>
        </a>
        <a href="#/review" data-nav="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg>
          <span>Review</span>
          <span id="due-badge" class="badge" hidden></span>
        </a>
      </nav>
      <button type="button" id="theme-toggle" class="gear" title="Light or dark" aria-label="Switch between light and dark"></button>
      <a href="#/settings" class="gear" data-nav="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4" /></svg>
      </a>
      <a href="#/" id="streak-chip" class="chip" hidden></a>
    </header>

    <main id="view"></main>
    <aside id="panel" hidden></aside>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
